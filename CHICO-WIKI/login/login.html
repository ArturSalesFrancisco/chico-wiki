<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuário</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <div class="faixa-topo">
            <h1>CHICO WIKI</h1>
        </div>
            <div class="faixa-verde"></div>
    </header>
    
<main class="tela-login">

    <div class="painel-login">

        <h1>ARQUIVO DE USUÁRIOS DO REINO</h1>
        <p>
            Faça login para acessar seus favoritos
            e recursos especiais da CHICO WIKI.
        </p>

        <form id="form-login">
            <input type="text" id="login" placeholder="Usuário: ">
            <input type="text" id="senha" placeholder="Senha: ">
            <button type="submit">Entrar</button>
        </form>

        <form id="form-cadastro">
            <input type="text" id="cadastro-nome" placeholder="Nome: ">
            <input type="text" id="cadastro-usuario" placeholder="Usuário: ">
            <input type="text" id="cadastro-senha" placeholder="Senha: ">
            <input type="text" id="cadastro-senha2" placeholder="Confirmar senha: ">
            <button type="submit">Cadastrar</button>
        </form>

        <button id="abrir-cadastro">Criar conta</button>
        <button id="voltar-login">Voltar para o login</button>

    </div>

</main>
    <script src="login.js"></script>
</body>
</html>
