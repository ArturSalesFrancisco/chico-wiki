<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <div class="faixa-topo">
            <h1>PERSONAGENS</h1>
        </div>
        <nav>
            <ul class="menu-cabecalho">
                <li><a href="../index.html">Início</a></li>
                <li><a href="../capitulos/capitulos.html">Capítulos</a></li>
                <li><a href=>Locais</a></li>
                <li><a href="personagens.html">Personagens</a></li>
            </ul>
            <div class="faixa-verde"></div>
        </nav>
    </header>

    <main class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="info-lateral h-100">
                    <div class="nome-personagem">
                        <h1 id="nome"></h1>
                    </div>
                    <img id="imagem" class="icone-personagem" scr="" alt="">
                    <h2 id="pseudonimo" class="pseudonimo-personagem"></h2>
                    <strong>Ocupação: </strong> <p id="ocupacao"></p>
                    <strong>Local de origem: </strong> <p id="origem"></p>
                </div>
            </div>
            <div class="col-md-2">
                <div class="faixa-arquivo"></div>
                <div class="dados h-50">
                    <strong>Idade: </strong> <p id="idade"></p>
                    <strong>Estado: </strong> <p id="estado"></p>
                    <strong>Espécie: </strong> <p id="especie"></p>
                    <strong>Gênero: </strong> <p id="genero"></p>
                    <div class="faixa-verde"></div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="faixa-arquivo-2"></div>
                <div class="descricao h-50">
                    <strong>Descrição: </strong> <p id="descricao"></p>
                </div>
            </div>
        </div>
        
        
    </main>

    <footer>
        <div class="faixa-rodape">
            <a href="https://www.instagram.com/narradordochico/" class="button">Conheça o Instagram do Chico!</a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="detalhespersonagem.js"></script>
</body>
</html>
